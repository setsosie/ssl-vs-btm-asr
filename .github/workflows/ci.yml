name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: these jobs lint, typecheck and test. Nothing writes to the
# repository, so the default token scope is more than they need.
permissions:
  contents: read

      - name: pytest
        run: uv run --no-sync pytest

  lock:
    name: uv.lock is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.7.8"

      # Resolution only, no downloads: fails if uv.lock and pyproject.toml have
      # drifted apart. This is what keeps the `checks` job's fresh resolve
      # honest, since that job installs from pyproject rather than the lock.
      - name: uv lock --check
        run: uv lock --check
