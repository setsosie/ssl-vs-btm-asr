# Shared defaults overlaid onto every run. Anything here overrides the dataclass
# defaults in src/svb/config.py; CLI flags override this.
model:
  name: xeus
  hidden_size: 1024
  # Path to the XEUS SSL checkpoint (espnet/xeus). Leave null to read from the
  # $XEUS_CHECKPOINT environment variable in the launcher. Required for arms A/B.
  xeus_checkpoint: null
  blank_bias_init: null

optim:
  # Best trial of the author's earlier hyperparameter search, verbatim.
  # Effective batch = batch_size * accum_steps
  # on a single GPU = 16. State this in the paper (the cluster runs used eff 64).
  lr: 7.446693063298197e-05
  weight_decay: 0.0024151339921234323
  grad_clip: 0.507731238072093
  warmup_ratio: 0.08544536055130553
  batch_size: 8
  accum_steps: 2

train:
  phase0_epochs: 15
  expert_epochs: 9
  finetune_epochs: 50
  patience: 15
  bf16: true
  grad_checkpointing: true
  max_audio_samples: 200000
  num_workers: 8
  # Common Voice's official train.tsv is roughly one clip per sentence, so it
  # holds about a third of the validated audio and makes most languages look
  # too small to train on. "validated_minus_eval" trains on every validated
  # clip that is not in dev or test and does not belong to a dev or test
  # speaker. Set to "train" to reproduce a run made against the official split.
  cv_train_source: validated_minus_eval

text:
  # No global policy. Each language is normalized under the policy its preset
  # names, which is chosen for the script it is written in; see
  # docs/normalization.md. Set `override:` to a policy name to force every
  # language onto one — useful for comparing against a published system's
  # numbers, at the cost of whatever that system's rules do to the scripts it
  # was not designed for.
  override: null
  # A full run's corpora are large enough that a character occurring under five
  # times corpus-wide is a stray from another script, not a letter of any of the
  # languages. Smoke runs leave this at the code default of 1, where a real
  # character may legitimately be that rare.
  min_char_count: 5
