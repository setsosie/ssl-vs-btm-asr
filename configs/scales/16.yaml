# Scale-16 preset: typologically diverse Common Voice languages spanning
# Germanic, Romance, Slavic, Indo-Aryan, Turkic, Semitic, Kartvelian, Bantu,
# CJK and Uralic families — the spread that lets the merge×typology analysis
# (finding #2) separate near-from-far languages. Verify each config has enough
# train hours on the CV release you pin.
