# Held-out Indic transfer set — never in any training mix (finding #3).
#
# Fetched straight from openslr.org as zip archives; no Hugging Face `datasets`,
# no `trust_remote_code`, no account. Run `python scripts/fetch_openslr.py
# --root $OPENSLR_ROOT` once, then set $OPENSLR_ROOT so $OPENSLR_ROOT/SLR<slr>/
# holds the extracted `<FileID>.wav` files and the index files listed below.
#
# These corpora ship no train/validation/test split. The loader derives an
# 80/10/10 partition at load time from a stable SHA-1 of the speaker id, so it
# does not depend on any library's shuffle implementation and test speakers are
# unseen during training. See docs/data.md.
#
# `archives` and `index_files` are parallel lists: every archive contains its own
# index member named `line_index.tsv`, so the fetch script renames archive i's
# index to index_files[i] on extraction. Marathi is female-speakers-only and its
# single index keeps the in-archive name.
languages:
  - code: malayalam
    source: openslr
    slr: 63
    archives: [ml_in_female.zip, ml_in_male.zip]
    index_files: [line_index_female.tsv, line_index_male.tsv]
    license: CC-BY-SA-4.0
  - code: marathi
    source: openslr
    slr: 64
    archives: [mr_in_female.zip]
    index_files: [line_index.tsv]
    license: CC-BY-SA-4.0
  - code: telugu
    source: openslr
    slr: 66
    archives: [te_in_female.zip, te_in_male.zip]
    index_files: [line_index_female.tsv, line_index_male.tsv]
    license: CC-BY-SA-4.0
  - code: gujarati
    source: openslr
    slr: 78
    archives: [gu_in_female.zip, gu_in_male.zip]
    index_files: [line_index_female.tsv, line_index_male.tsv]
    license: CC-BY-SA-4.0

