  - { code: eu, source: commonvoice, hf_dataset: common_voice_25, hf_config: eu, text_column: sentence, normalizer: whisper-basic }
  - { code: ab, source: commonvoice, hf_dataset: common_voice_25, hf_config: ab, text_column: sentence, normalizer: whisper-basic }
  - { code: ba, source: commonvoice, hf_dataset: common_voice_25, hf_config: ba, text_column: sentence, normalizer: whisper-basic }
  - { code: kab, source: commonvoice, hf_dataset: common_voice_25, hf_config: kab, text_column: sentence, normalizer: latin-marks }
