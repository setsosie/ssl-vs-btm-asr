  - { code: fr, source: commonvoice, hf_dataset: common_voice_25, hf_config: fr, text_column: sentence, normalizer: whisper-basic }
  - { code: es, source: commonvoice, hf_dataset: common_voice_25, hf_config: es, text_column: sentence, normalizer: whisper-basic }
  - { code: be, source: commonvoice, hf_dataset: common_voice_25, hf_config: be, text_column: sentence, normalizer: whisper-basic }
