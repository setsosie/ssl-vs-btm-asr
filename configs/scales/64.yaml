# Large-scale preset — 64 languages.
#
# Forty-six come from Common Voice 25 and eighteen from other public corpora,
# each recorded in configs/corpora.yaml with its licence, download and hours.
#
# The rule is at least 50 hours of training audio plus a real dev and a real
# test split of at least 2 hours each. Training audio means what a run actually
# reads: for Common Voice, validated minus the evaluation splits; for a corpus
# that ships a partition, its train split; for one that does not, the total less
# the tenth each the loader's derivation gives dev and test.
#
# Seven entries are below the rule and say so in docs/languages.md rather than
# quietly passing. Four NCHLT languages (zu 48.5 h, xh 49.4, ts 49.8, ve 49.6)
# ship a train split just under the bar against a corpus of about 56 hours.
# Korean has 42.2 h once its 1.2-hour shipped test is discarded and all 52.8 h
# are repartitioned, and it is the only openly-licensed Korean corpus there is,
# so dropping it would cost the preset the Koreanic family and Hangul outright.
# Finnish (11.1 h) and Hindi (7.0 h) are carried because the 3- and 16-language
# presets commit to them and the tiers have to nest.
#
# Thirty-two entries carry no `normalizer:` yet — the fourteen Common Voice
# languages added when the training statistic changed, and all eighteen new
# corpora. Their policies land separately. A preset entry with no policy loads
# fine and fails a run at policy resolution, by name; the alternative, a
# placeholder policy name, would make the preset itself unloadable.
#
# The held-out transfer languages (ml, mr, te, gu) and Odia are absent by rule.
# Five of the corpora below come from the same crowdsourced programme as the
# held-out four, so that is enforced by a test, not by care.
#
# Regenerate with scripts/select_languages.py, which carries existing
# `normalizer:` values forward. Every locale considered, with its hours and the
# reason it is in or out, is in docs/languages.md.
#
# Common Voice 25 is local-only: set $CV_ROOT so
# $CV_ROOT/<hf_config>/{train,dev,test,validated}.tsv exist. Everything else is
# staged by scripts/prepare_<corpus>.py under $CORPORA_ROOT.
# Awaiting a normalization policy, so they carry no `normalizer:` yet:
#   ady
#   bn
#   bo
#   ckb
#   cs
#   cy
#   et
#   fa
#   fy-NL
#   hr
#   hy
#   is
#   jv
#   kbd
#   kk
#   kmr
#   kn
#   ko
#   lv
#   ne
#   nso
#   pt
#   si
#   su
#   th
#   ts
#   ur
#   ve
#   xh
#   yue
#   zh-CN
#   zu
# A run resolving policies will fail by name on these until they land.
