# Large-scale preset — 32 languages, not 64.
#
# The scale tiers were planned as 3 / 16 / 64 and this file keeps the name of
# the tier it fills, so `get_preset("64")` and `--scale 64` still resolve. What
# it does not do is contain 64 languages, and no amount of searching Common
# Voice 25 would make it.
#
# The rule this list applies is at least 50 hours of training audio plus a real
# dev and a real test split — at least 2 hours of each. Training audio means
# validated minus the evaluation splits, which is what a run reads, not the
# official train.tsv: Corpora Creator builds that from a deduplicated frame at
# roughly one clip per sentence, so it is about a third of the validated audio.
# On the pool a run reads, **44** of Common Voice 25's 290 locales clear the
# rule.
#
# This list is not those 44. It holds the 32 languages selected against the
# official train.tsv, back when only 24 locales cleared 50 hours, and it has NOT
# been regenerated: a decision is pending on whether the largest tier should be
# the 44+ this corpus supports or a 64 that draws on other corpora as well. Every
# language here is still selected by the rule, so this is a subset of it, and
# docs/languages.md names the fourteen it is missing.
#
# Reaching 64 languages from Common Voice alone is now a question of where the
# threshold goes rather than whether it is possible: 16 hours of training audio
# selects exactly 64. That is a decision about what the paper wants its largest
# scale to mean, and this file does not make it.
#
# Every locale considered, with its hours and the reason it is in or out, is in
# docs/languages.md. Regenerate the list with scripts/select_languages.py.
#
# CV25 is local-only: set $CV_ROOT so $CV_ROOT/<hf_config>/{train,dev,test}.tsv exist.
languages:
  - { code: ca, source: commonvoice, hf_dataset: common_voice_25, hf_config: ca, text_column: sentence, normalizer: whisper-basic }
  - { code: en, source: commonvoice, hf_dataset: common_voice_25, hf_config: en, text_column: sentence, normalizer: whisper-basic }
  - { code: rw, source: commonvoice, hf_dataset: common_voice_25, hf_config: rw, text_column: sentence, normalizer: latin-marks }
  - { code: de, source: commonvoice, hf_dataset: common_voice_25, hf_config: de, text_column: sentence, normalizer: whisper-basic }
  - { code: fr, source: commonvoice, hf_dataset: common_voice_25, hf_config: fr, text_column: sentence, normalizer: whisper-basic }
  - { code: es, source: commonvoice, hf_dataset: common_voice_25, hf_config: es, text_column: sentence, normalizer: whisper-basic }
  - { code: be, source: commonvoice, hf_dataset: common_voice_25, hf_config: be, text_column: sentence, normalizer: whisper-basic }
  - { code: it, source: commonvoice, hf_dataset: common_voice_25, hf_config: it, text_column: sentence, normalizer: whisper-basic }
  - { code: gl, source: commonvoice, hf_dataset: common_voice_25, hf_config: gl, text_column: sentence, normalizer: whisper-basic }
  - { code: eo, source: commonvoice, hf_dataset: common_voice_25, hf_config: eo, text_column: sentence, normalizer: whisper-basic }
  - { code: mhr, source: commonvoice, hf_dataset: common_voice_25, hf_config: mhr, text_column: sentence, normalizer: whisper-basic }
  - { code: ps, source: commonvoice, hf_dataset: common_voice_25, hf_config: ps, text_column: sentence, normalizer: perso-arabic }
  - { code: ug, source: commonvoice, hf_dataset: common_voice_25, hf_config: ug, text_column: sentence, normalizer: uyghur-ug }
  - { code: eu, source: commonvoice, hf_dataset: common_voice_25, hf_config: eu, text_column: sentence, normalizer: whisper-basic }
  - { code: ab, source: commonvoice, hf_dataset: common_voice_25, hf_config: ab, text_column: sentence, normalizer: whisper-basic }
  - { code: ba, source: commonvoice, hf_dataset: common_voice_25, hf_config: ba, text_column: sentence, normalizer: whisper-basic }
  - { code: kab, source: commonvoice, hf_dataset: common_voice_25, hf_config: kab, text_column: sentence, normalizer: latin-marks }
  - { code: lg, source: commonvoice, hf_dataset: common_voice_25, hf_config: lg, text_column: sentence, normalizer: latin-marks }
  - { code: hu, source: commonvoice, hf_dataset: common_voice_25, hf_config: hu, text_column: sentence, normalizer: whisper-basic }
  - { code: ka, source: commonvoice, hf_dataset: common_voice_25, hf_config: ka, text_column: sentence, normalizer: whisper-basic }
  - { code: ta, source: commonvoice, hf_dataset: common_voice_25, hf_config: ta, text_column: sentence, normalizer: indic-vistaar }
  - { code: sw, source: commonvoice, hf_dataset: common_voice_25, hf_config: sw, text_column: sentence, normalizer: latin-marks }
  - { code: uz, source: commonvoice, hf_dataset: common_voice_25, hf_config: uz, text_column: sentence, normalizer: latin-marks }
  - { code: nl, source: commonvoice, hf_dataset: common_voice_25, hf_config: nl, text_column: sentence, normalizer: whisper-basic }

  # Below the rule on the official train.tsv, kept because the 16-language
  # preset commits to them and the smaller tiers have to stay subsets of this
  # one. On the pool a run actually reads, six of these eight clear the rule on
  # their own — only Finnish (11.1 h) and Hindi (7.0 h) still do not. Hours per
  # language are in docs/languages.md.
  - { code: tr, source: commonvoice, hf_dataset: common_voice_25, hf_config: tr, text_column: sentence, normalizer: turkic-tr }
  - { code: ru, source: commonvoice, hf_dataset: common_voice_25, hf_config: ru, text_column: sentence, normalizer: whisper-basic }
  - { code: uk, source: commonvoice, hf_dataset: common_voice_25, hf_config: uk, text_column: sentence, normalizer: whisper-basic }
  - { code: ar, source: commonvoice, hf_dataset: common_voice_25, hf_config: ar, text_column: sentence, normalizer: arabic-ouaal }
  - { code: pl, source: commonvoice, hf_dataset: common_voice_25, hf_config: pl, text_column: sentence, normalizer: whisper-basic }
  - { code: ja, source: commonvoice, hf_dataset: common_voice_25, hf_config: ja, text_column: sentence, word_boundary: false, normalizer: ja-cer }
  - { code: hi, source: commonvoice, hf_dataset: common_voice_25, hf_config: hi, text_column: sentence, normalizer: indic-vistaar }
  - { code: fi, source: commonvoice, hf_dataset: common_voice_25, hf_config: fi, text_column: sentence, normalizer: whisper-basic }
