    transcripts: STM (read), plus VTT and the original Transcriber TRS (left in the archive)
    speaker_ids: per-recording
    ships_split: full
    train_hours: 1334.0
    dev_hours: 21.0
    test_hours: 23.0
    preparer: scripts/prepare_taltech.py
    citation: >-
      Alumäe, Kalda, Bode and Kaitsa, "Automatic Closed Captioning for Estonian
      Live Broadcasts", NoDaLiDa 2023, pages 492-499.
      https://aclanthology.org/2023.nodalida-1.49
    notes: >-
      16 kHz 16-bit mono PCM WAV, confirmed from a sampled member's RIFF header;
      the page states no format. The audio is LONG-FORM — recordings run half an
      hour and more — and the manifest layer addresses whole files, so the
      preparer cuts every recording at its STM segment bounds into roughly
      600,000 small WAVs. Budget about 320 GB of peak disk: the 159 GB tar and
      its extracted tree exist at the same time, before the cut segments settle
      at about 130 GB. Speaker ids are scoped to a recording — the recording id
      prefixes every speaker id in its own STM — so the same person in two
      recordings is two ids and the shipped split CANNOT be claimed
      speaker-disjoint across recordings. Transcription is non-professional with
      a documented error rate the publisher puts under 5% of words, and not all
      of the 1334 training hours are speech. The page pairs its ShareAlike tag
      with "Copyright of the audio material in the dataset belongs to
      corresponding parties", which is worth reading before redistributing
      anything derived from it. No checksum is published; the length is checked
      against Content-Length and the server is Range-capable.

