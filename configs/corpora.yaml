# Corpora other than Common Voice.
#
# One entry per downloadable resource. Every hours, licence and format value was
# read on the `source_page` in the same entry; where a page does not publish a
# value it is null and the field name is listed under `unverified`, so a reader
# can tell "the page does not say" from "nobody filled this in". Do not fill one
# of those in from memory — check the archive at ingest and record what it was.
#
# `licence_name` is verbatim as the source page words it. The mix is deliberate
# and worth a sentence in any write-up: CC BY 2.0, 3.0 and 4.0 and CC BY-SA 4.0
# all appear, and ShareAlike over a training corpus is not settled law with
# respect to model weights.
#
# Schema and field meanings: src/svb/data/corpora.py. Layout of what a preparer
# writes: docs/data.md.
#
# Held out and therefore absent by rule, not by oversight: Malayalam, Marathi,
# Telugu, Gujarati and Odia. Several corpora below come from the same Google
# crowdsourced family as the held-out four, so a test asserts none of those five
# is offered here as training data.

corpora:
  # --- Google crowdsourced OpenSLR sets ------------------------------------
  # Five languages, one archive layout, one preparer. Each ships 16 zip shards
  # named asr_<language>_{0..9,a..f}.zip and a single utt_spk_text.tsv of
  # FileID / anonymized UserID / transcript. That third column is why these
  # need no id parsing to get a speaker, unlike the held-out four, whose
  # two-column line_index.tsv forces the speaker out of the FileID.
  # Hours are from Table 1 of Kjartansson et al., SLTU 2018; the OpenSLR pages
  # publish none.
  - id: slr35_javanese
    name: Large Javanese ASR training data set
    languages: [jv]
    source_page: https://www.openslr.org/35/
    licence_name: Attribution-ShareAlike 4.0 International
    licence_url: https://creativecommons.org/licenses/by-sa/4.0/
    downloads:
      - name: asr_javanese_{shard}.zip
        url_pattern: https://www.openslr.org/resources/35/asr_javanese_{shard}.zip
        shards: "0123456789abcdef"
        size_each: 1.1G
    audio_format: flac
    sample_rate_hz: 16000
    transcripts: utt_spk_text.tsv — FileID, UserID, transcript (tab-separated, no header)
    speaker_ids: column
    ships_split: none
    total_hours: 296.0
    speakers: "1019"
    preparer: scripts/prepare_google_crowdsourced.py
    citation: >-
      Kjartansson et al. (2018), "Crowd-Sourced Speech Corpora for Javanese,
      Sundanese, Sinhala, Nepali, and Bangladeshi Bengali", SLTU.
    notes: >-
      The OpenSLR page states only "wave files"; the archives are FLAC, which the
      preparer checks rather than assumes.
    unverified: [sample_rate_hz]

