  # NCHLT, via SADiLaR's DSpace 7 REST API. The resources page mentions
  # accepting terms of use, but the bitstream endpoint serves to an
  # unauthenticated client (verified: HTTP 206, application/zip, PK magic). The
  # preparer resolves a handle to a download URL through
  #   /server/api/core/items/{uuid}/bundles -> ORIGINAL
  #   -> /server/api/core/bundles/{uuid}/bitstreams -> _links.content.href
  # and reads dc.rights.license and dc.description from the same API, so the
  # licence and the corpus size are asserted at fetch time rather than trusted
  # from this file.
  #
  # Per-split hours are from van der Westhuizen & Niesler, Stellenbosch
  # technical report SU-EE-1501, which reports three-way speaker-disjoint
  # splits; the ~56 h corpus totals are SADiLaR's own. All five have a train
  # split just under 50 h, which is recorded rather than rounded up.
  - id: nchlt_zulu
    name: NCHLT isiZulu Speech Corpus
    languages: [zu]
    source_page: https://repo.sadilar.org/handle/20.500.12185/275
    licence_name: Creative Commons Attribution 3.0 Unported License (CC BY 3.0)
    licence_url: https://creativecommons.org/licenses/by/3.0/
    downloads:
      - name: nchlt_zulu.zip
        api: DSpace bitstream, resolved from the item handle at fetch time
    audio_format: wav
    sample_rate_hz: 16000
    transcripts: per-utterance XML
    speaker_ids: column
    ships_split: full
    train_hours: 48.5
    dev_hours: 3.7
    test_hours: 4.0
    speakers: 194 train / 8 dev / 8 test
    preparer: scripts/prepare_nchlt.py
    citation: NCHLT Speech Corpus, South African Department of Arts and Culture; SADiLaR.
    notes: >-
      Read prompts, narrow domain, and the published test suite is 8 speakers.
      Train alone is 48.5 h, under the 50 h rule; the corpus totals about 56 h.

