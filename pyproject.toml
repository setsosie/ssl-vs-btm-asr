[project]
name = "ssl-vs-btm-asr"
version = "0.1.0"
description = "Is it SSL pretraining or Branch-Train-Merge that carries low-resource multilingual ASR? A clean, multi-seed ablation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "numpy>=1.24",
    "datasets>=2.18",
    "soundfile>=0.12",
    "jiwer>=3.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
svb = "svb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svb"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
