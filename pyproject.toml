[project]
name = "ssl-vs-btm-asr"
version = "0.1.0"
description = "Is it SSL pretraining or Branch-Train-Merge that carries low-resource multilingual ASR? A clean, multi-seed ablation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Upper bounds are deliberate, not cautious boilerplate. Some of these
# packages change *semantics* across majors, which silently changes reported
# numbers: jiwer 3.x raises on an empty reference where 4.x scores it.
# A multi-seed ablation cannot pin its conclusions to an unpinned resolver.
dependencies = [
    "torch>=2.1,<3",
    "torchaudio>=2.1,<3",
    "numpy>=1.24,<3",
    "soundfile>=0.12,<1",
    "jiwer>=4.0,<5",
    "pyyaml>=6.0,<7",
    # Already present transitively via jiwer, declared directly because the
    # statistics layer calls its sequence Levenshtein on token lists rather than
    # going back through jiwer's string interface. An undeclared import that
    # happens to be installed is the kind of dependency that disappears on the
    # day jiwer changes its own.
    "rapidfuzz>=3,<4",
]

[project.optional-dependencies]
# Pinned exactly: the lint/type findings a contributor sees must match the ones
# CI sees. An unpinned ruff turns a green branch red on an unrelated release.
dev = [
    "pytest>=9.1,<10",
    "ruff==0.16.6",
    "mypy>=2.3,<3",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0,<5",
]

[project.scripts]
svb = "svb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svb"]
# Ship the inline type information; without this the marker is packaged but
# consumers still get `import-untyped` for every `svb.*` module.
force-include = { "src/svb/py.typed" = "svb/py.typed" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Chosen, not inherited: ruff's defaults drift between releases, so the rule set
# is spelled out. `BLE`/`S` are deliberately absent — every occurrence in this
# repo is an intentional never-crash guard (provenance capture, optional column
# casts), so those rules would be 100% false-positive here.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "PLE", "RUF"]
ignore = [
    # This repo exists to process non-Latin scripts; ambiguous-unicode rules fire
    # on legitimate content (Greek letters naming LayerNorm parameters, Indic
    # transcripts in fixtures).
    "RUF001",
    "RUF002",
    "RUF003",
    # Line length is the formatter's job; the linter flagging it too is noise.
    "E501",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Third-party packages that ship no stubs and no py.typed marker.
module = ["torchaudio.*", "soundfile.*", "jiwer.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Annotations are required throughout `svb.*`, with no exemptions.
module = ["svb.*"]
disallow_untyped_defs = true
