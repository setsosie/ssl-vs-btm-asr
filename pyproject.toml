[project]
name = "ssl-vs-btm-asr"
version = "0.1.0"
description = "Is it SSL pretraining or Branch-Train-Merge that carries low-resource multilingual ASR? A clean, multi-seed ablation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Upper bounds are deliberate, not cautious boilerplate. Several of these
# packages change *semantics* across majors, which silently changes reported
# numbers: jiwer 3.x raises on an empty reference where 4.x scores it, and
# `datasets` 2/3/5 disagree about whether script-based corpora load at all.
# A multi-seed ablation cannot pin its conclusions to an unpinned resolver.
dependencies = [
    "torch>=2.1,<3",
    "torchaudio>=2.1,<3",
    "numpy>=1.24,<3",
    "datasets>=2.18",
    "soundfile>=0.12",
    "jiwer>=4.0,<5",
    "pyyaml>=6.0,<7",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
# Pinned exactly: the lint/type findings a contributor sees must match the ones
# CI sees. An unpinned ruff turns a green branch red on an unrelated release.
dev = [
    "pytest>=9.1,<10",
    "ruff==0.16.6",
    "mypy>=2.3,<3",
    "types-PyYAML>=6.0",
]

[project.scripts]
svb = "svb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svb"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
